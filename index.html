<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="robots" content="noindex,nofollow">
<title>JKDD Leads — Development/Test</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2e;--panel2:#10243a;--line:#203b57;--text:#eef6ff;--muted:#91a8bf;--blue:#168bff;--cyan:#36d8ff;--green:#36d399;--orange:#ffb454;--red:#ff6b6b;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#12345b 0,#07111f 42%,#030812 100%);color:var(--text);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.btn{border:1px solid var(--line);background:#10243a;color:var(--text);padding:10px 13px;border-radius:12px}.btn:hover{border-color:#3d6d9d}.btn.primary{background:linear-gradient(135deg,#0d6efd,#19b8ff);border:0;font-weight:800}.btn.danger{border-color:#6c2424;color:#ffc7c7}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(560px,100%);background:linear-gradient(180deg,rgba(13,27,46,.98),rgba(7,17,31,.98));border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 30px 80px #0008}.brand{display:flex;align-items:center;gap:14px}.logo{width:66px;height:66px;border-radius:18px;background:linear-gradient(145deg,#0a1729,#122b48);border:2px solid #27a7ff;display:grid;place-items:center;font-weight:900;position:relative;box-shadow:inset 0 0 25px #138fff22}.logo:before{content:"◎";font-size:36px;color:#fff}.logo:after{content:"↗";position:absolute;color:#21b6ff;font-size:25px;right:9px;top:6px}.brand h1{margin:0;font-size:30px}.brand h1 span{color:#28a9ff}.muted{color:var(--muted)}.tiny{font-size:12px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);background:#071423;color:var(--text);border-radius:12px;padding:11px;outline:none}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0}.step{display:grid;justify-items:center;gap:5px;color:#5f7890;font-size:11px}.step b{width:30px;height:30px;border:1px solid var(--line);background:#0b192b;border-radius:50%;display:grid;place-items:center}.step.on{color:#bcecff}.step.on b{background:linear-gradient(135deg,#0d6efd,#20c6c8);border:0}.notice{border:1px solid #285271;background:#0b2638;padding:12px;border-radius:13px;margin:12px 0;color:#d8f2ff}.notice.warn{border-color:#745519;background:#2a210a;color:#ffe2a8}.auth-options{display:grid;gap:10px}.auth-option{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:#0a1828;color:var(--text);border-radius:15px;padding:14px}.app{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}aside{height:100vh;position:sticky;top:0;background:#06101de8;border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:18px;backdrop-filter:blur(14px)}aside .brand .logo{width:48px;height:48px;border-radius:14px}.nav{display:grid;gap:7px}.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:11px;border-radius:12px;text-align:left}.nav button.active,.nav button:hover{background:#10243a;color:#fff;border-color:#274968}.side-foot{margin-top:auto;color:var(--muted);font-size:12px;border-top:1px solid var(--line);padding-top:12px}main{min-width:0}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 22px;border-bottom:1px solid var(--line);background:#07111fd9;backdrop-filter:blur(14px)}.top h2{margin:0;font-size:20px}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;color:var(--muted)}.badge.ok{color:#b9ffdf;border-color:#17664a;background:#05291e}.badge.warn{color:#ffe2a8;border-color:#765214;background:#2a1e05}.content{padding:22px;max-width:1450px;margin:auto}.hero{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:18px}.hero h1{font-size:30px;margin:0 0 7px}.hero p{margin:0;color:var(--muted)}.grid{display:grid;gap:16px}.metrics{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}.two{grid-template-columns:1.15fr .85fr}.card{background:linear-gradient(180deg,#0f2136ee,#0a1728ee);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 18px 48px #0005}.card h3{margin:0 0 11px}.metric strong{font-size:31px;display:block}.metric span{font-size:12px;color:var(--muted)}.lead-list{display:grid;gap:9px}.lead{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;border:1px solid var(--line);background:#091726;border-radius:14px}.lead.selected{border-color:#168bff;background:#0c2340}.lead strong{display:block}.score{font-size:25px;font-weight:900;text-align:right}.band{font-size:10px;padding:4px 7px;border-radius:999px;font-weight:900;display:inline-block}.HOT{background:#4a2316;color:#ffc089}.WARM{background:#44320b;color:#ffe49a}.NURTURE{background:#123c49;color:#8ae9ff}.LOW{background:#273241;color:#c8d2df}.toolbar,.actions,.quick{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin-bottom:12px}.toolbar input{max-width:330px}.detail{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:12px 0}.detail div{border:1px solid var(--line);border-radius:11px;padding:10px;background:#081522}.detail span{display:block;font-size:11px;color:var(--muted)}.ai-box{white-space:pre-wrap;min-height:115px;border:1px solid #1c5775;border-radius:14px;padding:13px;background:linear-gradient(180deg,#082536,#081a2a)}.chat{display:grid;gap:8px;max-height:360px;overflow:auto}.bubble{max-width:86%;padding:10px 12px;border-radius:14px}.bubble.ai{background:#0d3850}.bubble.customer{margin-left:auto;background:#223149}.bubble.system{max-width:100%;background:#30260c;color:#ffe3a5}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:9px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}.progress{height:9px;background:#071423;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#16a0ff,#36d399)}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:50}.modal-card{width:min(760px,100%);max-height:92vh;overflow:auto;background:#0b1a2c;border:1px solid var(--line);border-radius:20px;padding:18px}.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.full{grid-column:1/-1}.bottom{display:none}@media(max-width:920px){.app{grid-template-columns:82px 1fr}aside .brand div:last-child,.nav .lbl,.side-foot .copy{display:none}.nav button{text-align:center}.metrics{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}@media(max-width:680px){.app{display:block}aside{display:none}.content{padding:14px 14px 88px}.top{padding:13px 14px}.badges .badge:nth-child(n+3){display:none}.hero{display:block}.hero h1{font-size:25px}.hero>.btn{margin-top:12px}.metrics{grid-template-columns:repeat(2,1fr)}.form-grid,.detail{grid-template-columns:1fr}.full{grid-column:auto}.bottom{position:fixed;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(6,1fr);z-index:40;background:#06101df5;border-top:1px solid var(--line);padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.bottom button{border:0;background:transparent;color:#7890a8;font-size:10px}.bottom button.active{color:#55d8ff}}
</style>
</head><body><div id="root"></div>
<script>
(()=>{'use strict';
const V='0.6.0',K='jkdd-leads.dev.v0.6.0',KS='jkdd-leads.session.v1',KC='jkdd-leads.config.v1';
const seed=[
{id:'LD-1001',name:'Kener Santana',phone:'',service:'Finish Carpentry',source:'MANUAL_TEST',status:'QUALIFIED',score:82,band:'HOT',urgency:'now',budget:'clear',location:'Florida / Test',days:0},
{id:'LD-1002',name:'Neto Santana',phone:'',service:'Doors & Trim',source:'MANUAL_TEST',status:'NEW',score:58,band:'NURTURE',urgency:'30d',budget:'unknown',location:'Florida / Test',days:3},
{id:'LD-1003',name:'Davi Santana',phone:'',service:'Remodeling',source:'MANUAL_TEST',status:'ROUTED',score:71,band:'WARM',urgency:'30d',budget:'clear',location:'Florida / Test',days:1}
];
const load=(k,d)=>{try{const x=localStorage.getItem(k);return x?JSON.parse(x):structuredClone(d)}catch{return structuredClone(d)}};
let S={leads:load(K,seed),session:load(KS,null),cfg:{locale:'pt-BR',country:'US',vertical:'construction',...load(KC,{})},route:'dashboard',selected:null,ai:'Selecione um Lead ou use uma pergunta rápida.',voice:null,auth:{step:'email',email:'',name:'Joaquim Neto',company:'JKDD Finish & Remodeling'}};S.selected=S.leads[0]?.id||null;
const $=q=>document.querySelector(q),all=q=>[...document.querySelectorAll(q)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),dig=s=>String(s??'').replace(/\D/g,''),fmt=s=>{const d=dig(s).slice(-10);return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:s},e164=s=>{const d=dig(s);return d.length===10?'+1'+d:(d.length===11&&d[0]==='1'?'+'.concat(d):'+'.concat(d))};
function save(){localStorage.setItem(K,JSON.stringify(S.leads));localStorage.setItem(KC,JSON.stringify(S.cfg));S.session?localStorage.setItem(KS,JSON.stringify(S.session)):localStorage.removeItem(KS)}
function band(n){return n>=80?'HOT':n>=60?'WARM':n>=35?'NURTURE':'LOW'}
function calc(x){let n=0;if(x.service)n+=30;if(x.location)n+=15;n+=x.urgency==='now'?20:x.urgency==='30d'?12:5;if(x.budget==='clear')n+=15;if(x.phone)n+=10;if(x.email)n+=5;if(x.photos)n+=5;return Math.min(100,n)}
const sel=()=>S.leads.find(x=>x.id===S.selected)||S.leads[0];
function next(l){if(!l)return'Selecione um Lead.';if(l.band==='HOT'&&l.status==='NEW')return'Qualificar agora e confirmar necessidade, localização e prazo.';if(l.band==='HOT'&&l.status==='QUALIFIED')return'Fazer contato manual e preparar roteamento/handoff.';if(l.status==='ROUTED')return'Confirmar aceite do destino antes de marcar HANDED_OFF.';if((l.days||0)>=3)return'Fazer follow-up hoje.';return'Coletar mais contexto e agendar próxima ação.'}
function explain(l){return`Score ${l.score}/100 (${l.band}). ${l.urgency==='now'?'Urgência imediata. ':''}${l.budget==='clear'?'Orçamento indicado. ':''}${l.phone?'Telefone disponível. ':''}Próxima ação: ${next(l)}`}
function draft(l){return`Olá, ${l.name}! Aqui é da JKDD. Estou entrando em contato sobre seu interesse em ${l.service}. Posso fazer algumas perguntas rápidas para entender melhor o que você precisa?`}
function brief(){const hot=S.leads.filter(x=>x.band==='HOT').length,st=S.leads.filter(x=>(x.days||0)>=3).length,ready=S.leads.filter(x=>x.score>=70&&['QUALIFIED','ROUTED'].includes(x.status)).length;return`Morning Brief — ${S.leads.length} Leads. ${hot} HOT, ${st} follow-up(s), ${ready} pronto(s) para rota/handoff.`}
function ask(q){q=(q||'').toLowerCase();const l=sel();if(q.includes('lig')||q.includes('contat'))return[...S.leads].sort((a,b)=>b.score-a.score).map((x,i)=>`${i+1}. ${x.name} — ${x.score} ${x.band} — ${next(x)}`).join('\n');if(q.includes('quente')||q.includes('hot'))return'Leads HOT: '+S.leads.filter(x=>x.band==='HOT').map(x=>`${x.name} (${x.score})`).join(', ');if(q.includes('follow')||q.includes('esquec'))return'Follow-up: '+S.leads.filter(x=>(x.days||0)>=3).map(x=>x.name).join(', ');if(q.includes('crm')||q.includes('handoff'))return'Prontos: '+S.leads.filter(x=>x.score>=70&&['QUALIFIED','ROUTED'].includes(x.status)).map(x=>x.name).join(', ');if(q.includes('canal')||q.includes('fonte')){const c={};S.leads.forEach(x=>c[x.source]=(c[x.source]||0)+1);return Object.entries(c).map(([a,b])=>`${a}: ${b}`).join(' • ')}return l?`${l.name}: ${explain(l)}`:brief()}
function logo(){return`<div class="logo"></div>`}
function render(){if(!S.session)return login();const root=$('#root'),nav=[['dashboard','⌂','Dashboard'],['leads','◎','Leads'],['ai','✦','AI Copilot'],['voice','◉','Voice Lab'],['automation','⚡','Automation'],['analytics','▥','Analytics'],['settings','⚙','Settings']];root.innerHTML=`<div class="app"><aside><div class="brand">${logo()}<div><b>JKDD <span style="color:#29aaff">Leads</span></b><div class="tiny muted">Development/Test</div></div></div><nav class="nav">${nav.map(n=>`<button data-r="${n[0]}" class="${S.route===n[0]?'active':''}">${n[1]} <span class="lbl">${n[2]}</span></button>`).join('')}</nav><div class="side-foot"><span style="color:#36d399">●</span> <span class="copy">Local runtime active<br>Budget US$ 0<br>Production 🔒</span></div></aside><main><header class="top"><h2>${nav.find(n=>n[0]===S.route)?.[2]||'JKDD Leads'}</h2><div class="badges"><span class="badge ok">DEV/TEST</span><span class="badge">v${V}</span><span class="badge">${esc(S.session.company)}</span><span class="badge warn">PROD 🔒</span></div></header><div class="content"><div id="view"></div></div></main><nav class="bottom">${nav.slice(0,6).map(n=>`<button data-r="${n[0]}" class="${S.route===n[0]?'active':''}"><div>${n[1]}</div>${n[2].replace('AI ','')}</button>`).join('')}</nav></div>`;all('[data-r]').forEach(b=>b.onclick=()=>{S.route=b.dataset.r;render()});view()}
function login(){const a=S.auth,step=a.step,st=['email','account','password'];let body='';if(step==='email')body=`<h2>Entrar no JKDD Leads</h2><p class="muted">Digite seu e-mail. No primeiro acesso você cria seu cadastro e define a primeira senha.</p><div class="field"><label>E-mail</label><input id="email" type="email" value="${esc(a.email)}" placeholder="seuemail@empresa.com"></div><button class="btn primary" id="cont" style="width:100%">Continuar</button>`;if(step==='account')body=`<button class="btn" id="back">← Voltar</button><h2>${esc(a.email)}</h2><p class="muted">Escolha o fluxo.</p><div class="auth-options"><button class="auth-option" id="first"><b>✨</b><div><strong>Primeiro acesso</strong><div class="tiny muted">Criar cadastro e primeira senha</div></div><span>→</span></button><button class="auth-option" id="existing"><b>🔑</b><div><strong>Já tenho acesso</strong><div class="tiny muted">Entrar com e-mail e senha</div></div><span>→</span></button></div><div class="notice warn tiny">Auth real ainda aguarda o adapter web da JKDD TECH Foundation.</div>`;if(step==='password')body=`<button class="btn" id="back">← Voltar</button><h2>Crie seu acesso</h2><div class="form-grid"><div class="field full"><label>E-mail</label><input value="${esc(a.email)}" disabled></div><div class="field"><label>Nome</label><input id="nm" value="${esc(a.name)}"></div><div class="field"><label>Empresa</label><input id="co" value="${esc(a.company)}"></div><div class="field"><label>Primeira senha</label><input id="pw1" type="password"></div><div class="field"><label>Confirmar senha</label><input id="pw2" type="password"></div></div><label class="tiny"><input id="ok" type="checkbox"> Confirmo que este é um acesso Development/Test.</label><button class="btn primary" id="create" style="width:100%;margin-top:14px">Criar acesso e entrar</button><div class="notice tiny"><b>Segurança:</b> a senha é validada na tela e descartada. Não é gravada no navegador.</div>`;if(step==='existing')body=`<button class="btn" id="back">← Voltar</button><h2>Bem-vindo de volta</h2><div class="field"><label>E-mail</label><input value="${esc(a.email)}" disabled></div><div class="field"><label>Senha</label><input id="pw" type="password"></div><button class="btn primary" id="signin" style="width:100%">Entrar</button><div class="notice warn tiny">Validação real de senha pendente da Foundation.</div>`;$('#root').innerHTML=`<div class="login"><section class="login-card"><div class="brand">${logo()}<div><h1>JKDD <span>Leads</span></h1><div class="muted">Capture • Qualify • Route • Grow</div></div></div><div class="steps">${st.map((x,i)=>`<div class="step ${step===x?'on':''}"><b>${i+1}</b>${['E-mail','Acesso','Senha'][i]}</div>`).join('')}</div>${body}<div class="tiny muted" style="margin-top:18px;text-align:center">Shared Auth owner: 🧱 JKDD TECH Foundation • Production 🔒 UNTOUCHED</div></section></div>`;$('#cont')&&($('#cont').onclick=()=>{const e=$('#email').value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e))return alert('Digite um e-mail válido.');a.email=e;a.step='account';login()});$('#back')&&($('#back').onclick=()=>{a.step=step==='account'?'email':'account';login()});$('#first')&&($('#first').onclick=()=>{a.step='password';login()});$('#existing')&&($('#existing').onclick=()=>{a.step='existing';login()});$('#create')&&($('#create').onclick=()=>{const n=$('#nm').value.trim(),c=$('#co').value.trim(),p=$('#pw1').value,p2=$('#pw2').value;if(!n||!c)return alert('Preencha nome e empresa.');if(p.length<8||!/[A-Za-z]/.test(p)||!/\d/.test(p))return alert('Use 8+ caracteres, uma letra e um número.');if(p!==p2)return alert('As senhas não conferem.');if(!$('#ok').checked)return alert('Confirme Development/Test.');S.session={name:n,email:a.email,company:c,auth:'PENDING_FOUNDATION_WEB_ADAPTER'};save();render()});$('#signin')&&($('#signin').onclick=()=>{if(!$('#pw').value)return alert('Digite sua senha.');S.session={name:a.name,email:a.email,company:a.company,auth:'PENDING_FOUNDATION_WEB_ADAPTER'};save();render()})}
function leadCard(l){return`<div class="lead ${l.id===S.selected?'selected':''}" data-lead="${l.id}"><div><strong>${esc(l.name)}</strong><div class="tiny muted">${esc(l.service)} • ${esc(l.phone||'sem telefone')} • ${l.status}</div></div><div><div class="score">${l.score}</div><span class="band ${l.band}">${l.band}</span></div></div>`}
function view(){const el=$('#view');if(S.route==='dashboard')el.innerHTML=dashboard();if(S.route==='leads')el.innerHTML=leads();if(S.route==='ai')el.innerHTML=ai();if(S.route==='voice')el.innerHTML=voice();if(S.route==='automation')el.innerHTML=automation();if(S.route==='analytics')el.innerHTML=analytics();if(S.route==='settings')el.innerHTML=settings();bind()}
function dashboard(){const hot=S.leads.filter(x=>x.band==='HOT').length,q=S.leads.filter(x=>['QUALIFIED','ROUTED','HANDED_OFF'].includes(x.status)).length,st=S.leads.filter(x=>(x.days||0)>=3).length,top=[...S.leads].sort((a,b)=>b.score-a.score)[0],missing=S.leads.slice(0,3).some(x=>!x.phone);return`<div class="hero"><div><h1>Bom dia, ${esc(S.session.name.split(' ')[0])}.</h1><p>Seu centro de Leads com IA local, sem custo e em Development/Test.</p></div><button class="btn primary" data-a="new">+ Novo Lead</button></div>${missing?`<div class="notice warn"><b>Configuração privada:</b> informe os telefones de teste em Settings neste dispositivo. Eles não são publicados no GitHub. <button class="btn" data-a="go-settings">Configurar</button></div>`:''}<div class="grid metrics"><div class="card metric"><strong>${S.leads.length}</strong><span>Total Leads</span></div><div class="card metric"><strong>${hot}</strong><span>HOT</span></div><div class="card metric"><strong>${q}</strong><span>Qualified+</span></div><div class="card metric"><strong>${st}</strong><span>Follow-ups</span></div></div><div class="grid two"><div class="card"><h3>✦ Morning Brief</h3><div class="ai-box">${esc(brief())}</div><div class="quick"><button class="btn" data-q="quem devo ligar agora?">Quem contatar?</button><button class="btn" data-q="quem esqueci follow-up?">Follow-ups</button><button class="btn" data-q="quem vai para CRM?">Prontos CRM</button></div></div><div class="card"><h3>🔥 AI Priority Today</h3>${top?leadCard(top):''}<div class="notice"><b>Next Best Action</b><br>${esc(next(top))}</div></div></div><div class="grid two" style="margin-top:16px"><div class="card"><h3>Test Leads</h3><div class="lead-list">${S.leads.slice(0,5).map(leadCard).join('')}</div></div><div class="card"><h3>Capability status</h3><table class="table">${[['Lead Intake','IMPLEMENTED'],['Scoring','IMPLEMENTED'],['AI Copilot','IMPLEMENTED'],['Voice Lab','IMPLEMENTED'],['Local persistence','IMPLEMENTED'],['Foundation Auth UX','IMPLEMENTED'],['Auth backend','PENDING'],['Canonical DB','SPECIFIED'],['Production','LOCKED']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table></div></div>`}
function leads(){const l=sel();return`<div class="hero"><div><h1>Lead Inbox</h1><p>ONE LEAD → ONE CANONICAL RECORD → MULTIPLE PRODUCT VIEWS.</p></div><button class="btn primary" data-a="new">+ Novo Lead</button></div><div class="grid two"><div class="card"><div class="lead-list">${S.leads.map(leadCard).join('')}</div></div><div class="card">${l?`<div style="display:flex;justify-content:space-between"><div><h3>${esc(l.name)}</h3><div class="muted tiny">${l.id} • ${l.source}</div></div><div><div class="score">${l.score}</div><span class="band ${l.band}">${l.band}</span></div></div><div class="detail"><div><span>Phone</span><b>${esc(l.phone||'—')}</b></div><div><span>Status</span><b>${l.status}</b></div><div><span>Service</span><b>${esc(l.service)}</b></div><div><span>Location</span><b>${esc(l.location)}</b></div></div><div class="notice"><b>AI Score Explanation</b><br>${esc(explain(l))}</div><div class="actions"><button class="btn primary" data-a="advance">Avançar lifecycle</button><button class="btn" data-a="ai">✦ AI Help</button><button class="btn" data-a="voice">◉ Voice Lab</button></div><div class="actions" style="margin-top:8px"><button class="btn" data-a="call">☎ Telefone</button><button class="btn" data-a="sms">SMS</button><button class="btn" data-a="wa">WhatsApp</button></div><div class="notice warn tiny">Human approval required. Nada é enviado automaticamente.</div>`:''}</div></div>`}
function ai(){const l=sel();return`<div class="hero"><div><h1>✦ JKDD Leads AI</h1><p>Copiloto comercial zero-cost e determinístico.</p></div></div><div class="grid two"><div class="card"><h3>Ask AI</h3><div class="field"><textarea id="aq" rows="3" placeholder="quem devo ligar agora?"></textarea></div><div class="quick"><button class="btn" data-q="quem devo ligar agora?">Prioridade</button><button class="btn" data-q="quais leads estão quentes?">HOT</button><button class="btn" data-q="quem esqueci follow-up?">Follow-up</button><button class="btn" data-q="quem vai para CRM?">CRM</button><button class="btn" data-q="qual fonte performa melhor?">Fontes</button></div><button class="btn primary" data-a="ask">Perguntar</button><div class="ai-box" style="margin-top:12px">${esc(S.ai)}</div></div><div class="card"><h3>Selected Lead</h3>${l?leadCard(l):''}<div class="notice"><b>Next Best Action</b><br>${l?esc(next(l)):''}</div><textarea rows="6" readonly>${l?esc(draft(l)):''}</textarea><button class="btn" data-a="copy" style="margin-top:8px">Copiar mensagem</button></div></div><div class="card" style="margin-top:16px"><h3>AI safety boundary</h3><p class="muted">AI recomenda → usuário aprova → sistema executa → audit registra. Sem merge silencioso, campanhas automáticas, Opportunity automática ou alteração silenciosa de Source of Truth.</p></div>`}
function voice(){const v=S.voice;return`<div class="hero"><div><h1>◉ AI Voice Lab</h1><p>Simulação de conversa por voz no navegador. Sem ligação real e sem custo.</p></div></div><div class="notice warn"><b>PSTN/SIP OFF.</b> Use microfone, voz do dispositivo ou texto.</div><div class="grid two"><div class="card"><div class="field"><label>Lead</label><select id="vl">${S.leads.map(x=>`<option value="${x.id}" ${x.id===S.selected?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div><div class="field"><label>Modo</label><select id="vm"><option value="INBOUND">Inbound Receptionist</option><option value="OUTBOUND">Outbound Rehearsal</option></select></div><div class="actions"><button class="btn primary" data-a="vstart">Start</button><button class="btn" data-a="mic">🎤 Listen</button><button class="btn danger" data-a="vend">End</button></div><div class="field"><label>Customer reply</label><textarea id="vin" rows="3"></textarea></div><button class="btn" data-a="vsend">Enviar fala</button></div><div class="card"><h3>Transcript</h3><div class="chat">${v?.m?.length?v.m.map(m=>`<div class="bubble ${m.r.toLowerCase()}"><b>${m.r}</b><br>${esc(m.t)}</div>`).join(''):'<div class="muted">Inicie uma simulação.</div>'}</div>${v?.summary?`<div class="notice"><b>Summary</b><br>${esc(v.summary)}</div>`:''}</div></div>`}
function automation(){return`<div class="hero"><div><h1>⚡ Automation</h1><p>Regras determinísticas e auditáveis. Nenhum envio automático.</p></div></div><div class="grid two"><div class="card"><h3>Follow-up queue</h3><table class="table">${S.leads.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.days||0}d</td><td>${(x.days||0)>=3?'TODAY':'OK'}</td></tr>`).join('')}</table></div><div class="card"><h3>Automations</h3><table class="table">${[['Normalize','ON'],['Duplicate candidate','ON'],['Rule scoring','ON'],['Next Best Action','ON'],['Human approval','ON'],['Autonomous outbound','OFF']].map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td></tr>`).join('')}</table></div></div>`}
function analytics(){const bands=['HOT','WARM','NURTURE','LOW'],avg=Math.round(S.leads.reduce((a,b)=>a+b.score,0)/Math.max(1,S.leads.length));return`<div class="hero"><div><h1>▥ Analytics</h1><p>Métricas do dataset local de Development/Test.</p></div></div><div class="grid metrics"><div class="card metric"><strong>${avg}</strong><span>Avg Score</span></div><div class="card metric"><strong>${S.leads.filter(x=>x.status==='HANDED_OFF').length}</strong><span>Handed Off</span></div><div class="card metric"><strong>${new Set(S.leads.map(x=>x.source)).size}</strong><span>Sources</span></div><div class="card metric"><strong>${S.leads.length}</strong><span>Local Leads</span></div></div><div class="card"><h3>Score bands</h3>${bands.map(b=>{const n=S.leads.filter(x=>x.band===b).length;return`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between"><span>${b}</span><b>${n}</b></div><div class="progress"><i style="width:${S.leads.length?n/S.leads.length*100:0}%"></i></div></div>`}).join('')}</div>`}
function settings(){const p=n=>S.leads.find(x=>x.name===n)?.phone||'';return`<div class="hero"><div><h1>⚙ Settings</h1><p>Configurações locais; contratos compartilhados continuam Foundation-owned.</p></div></div><div class="grid two"><div class="card"><h3>Market</h3><div class="field"><label>Locale</label><select id="loc"><option>pt-BR</option><option>en-US</option></select></div><div class="field"><label>Country</label><select id="country"><option>US</option><option>BR</option></select></div><div class="field"><label>Vertical</label><select id="vertical"><option value="construction">Construction / Remodeling</option><option value="real_estate">Real Estate</option><option value="automotive">Automotive</option></select></div><button class="btn primary" data-a="savecfg">Salvar</button></div><div class="card"><h3>Governance</h3><table class="table"><tr><td>Budget</td><td>US$ 0</td></tr><tr><td>Environment</td><td>Development/Test</td></tr><tr><td>Production</td><td>🔒 UNTOUCHED</td></tr><tr><td>Auth backend</td><td>Foundation PENDING</td></tr><tr><td>Persistence</td><td>localStorage</td></tr><tr><td>Paid AI</td><td>OFF</td></tr></table><button class="btn danger" data-a="logout">Sign out</button></div></div><div class="card" style="margin-top:16px"><h3>🧪 Contatos privados de teste — somente neste dispositivo</h3><p class="muted">Os números não são publicados no GitHub. Digite uma vez e eles ficam somente neste navegador.</p><div class="form-grid"><div class="field"><label>Kener Santana</label><input id="pk" value="${esc(p('Kener Santana'))}" inputmode="tel"></div><div class="field"><label>Neto Santana</label><input id="pn" value="${esc(p('Neto Santana'))}" inputmode="tel"></div><div class="field"><label>Davi Santana</label><input id="pd" value="${esc(p('Davi Santana'))}" inputmode="tel"></div></div><div class="actions"><button class="btn primary" data-a="phones">Salvar neste dispositivo</button><button class="btn" data-a="clearphones">Limpar</button></div></div>`}
function bind(){all('[data-lead]').forEach(x=>x.onclick=()=>{S.selected=x.dataset.lead;view()});all('[data-q]').forEach(x=>x.onclick=()=>{S.ai=ask(x.dataset.q);S.route='ai';render()});const act=(a,f)=>{const x=$(`[data-a="${a}"]`);if(x)x.onclick=f};act('go-settings',()=>{S.route='settings';render()});act('new',newLead);act('advance',()=>{const l=sel();l.status=l.status==='NEW'?'QUALIFIED':l.status==='QUALIFIED'?'ROUTED':l.status==='ROUTED'?'HANDED_OFF':'HANDED_OFF';save();view()});act('ai',()=>{S.ai=ask('resuma');S.route='ai';render()});act('voice',()=>{S.route='voice';render()});act('ask',()=>{S.ai=ask($('#aq').value);view()});act('copy',async()=>{try{await navigator.clipboard.writeText(draft(sel()));alert('Mensagem copiada.')}catch{alert('Copie manualmente.')}});act('call',()=>{const l=sel();l.phone?location.href='tel:'+e164(l.phone):alert('Configure o telefone deste Lead em Settings.')});act('sms',()=>{const l=sel();l.phone?location.href='sms:'+e164(l.phone)+'?body='+encodeURIComponent(draft(l)):alert('Configure o telefone deste Lead em Settings.')});act('wa',()=>{const l=sel();l.phone?window.open('https://wa.me/'+dig(e164(l.phone))+'?text='+encodeURIComponent(draft(l)),'_blank'):alert('Configure o telefone deste Lead em Settings.')});const vl=$('#vl');if(vl)vl.onchange=()=>{S.selected=vl.value;view()};act('vstart',vstart);act('vsend',()=>{const t=$('#vin').value.trim();if(t)vsend(t)});act('vend',()=>{if(S.voice){S.voice.summary=S.voice.summary||'Simulação encerrada. Nenhuma ligação real foi feita.';S.voice.m.push({r:'SYSTEM',t:'Simulation ended. PSTN/SIP OFF.'});save();view()}});act('mic',mic);act('phones',()=>{[['Kener Santana','pk'],['Neto Santana','pn'],['Davi Santana','pd']].forEach(([n,id])=>{const l=S.leads.find(x=>x.name===n);if(l)l.phone=fmt($('#'+id).value)});save();alert('Salvo somente neste dispositivo.');view()});act('clearphones',()=>{S.leads.slice(0,3).forEach(x=>x.phone='');save();view()});act('savecfg',()=>{S.cfg.locale=$('#loc').value;S.cfg.country=$('#country').value;S.cfg.vertical=$('#vertical').value;save();alert('Configuração salva.');});act('logout',()=>{S.session=null;save();render()})}
function newLead(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modal-card"><div style="display:flex;justify-content:space-between"><h3>Novo Lead</h3><button class="btn" id="x">✕</button></div><form id="f"><div class="form-grid"><div class="field"><label>Name</label><input name="name" required></div><div class="field"><label>Phone</label><input name="phone"></div><div class="field"><label>Email</label><input name="email" type="email"></div><div class="field"><label>Source</label><select name="source"><option>MANUAL</option><option>WEBSITE</option><option>CONNECT</option><option>GOOGLE</option><option>META</option><option>REFERRAL</option><option>PARTNER</option></select></div><div class="field"><label>Interest</label><input name="service" required></div><div class="field"><label>Location</label><input name="location"></div><div class="field"><label>Urgency</label><select name="urgency"><option value="now">Now</option><option value="30d">30 days</option><option value="later">Later</option></select></div><div class="field"><label>Budget</label><select name="budget"><option value="unknown">Unknown</option><option value="clear">Clear</option></select></div></div><div class="notice warn tiny">MATCH ≠ MERGE. Possíveis duplicados nunca são mesclados automaticamente.</div><button class="btn primary">Normalize + Qualify + Score</button></form></div>`;document.body.appendChild(m);$('#x').onclick=()=>m.remove();$('#f').onsubmit=e=>{e.preventDefault();const f=new FormData(e.currentTarget),phone=fmt(f.get('phone'));if(phone&&S.leads.some(x=>dig(x.phone)===dig(phone))&&!confirm('Possível duplicado. Criar mesmo assim?'))return;const o={name:f.get('name'),phone,email:f.get('email'),service:f.get('service'),source:f.get('source'),location:f.get('location'),urgency:f.get('urgency'),budget:f.get('budget'),photos:false};const sc=calc(o);S.leads.unshift({...o,id:'LD-'+(1001+S.leads.length),status:sc>=60?'QUALIFIED':'NEW',score:sc,band:band(sc),days:0});S.selected=S.leads[0].id;save();m.remove();view()}}
function vstart(){const mode=$('#vm')?.value||'INBOUND';S.voice={mode,f:{},m:[],summary:''};const t=mode==='INBOUND'?'Olá! Eu sou a assistente virtual da JKDD. Posso fazer algumas perguntas rápidas para entender como podemos ajudar?':'Olá! Esta é uma simulação de follow-up da assistente virtual da JKDD. Podemos praticar algumas perguntas rápidas?';S.voice.m.push({r:'AI',t});speak(t);view()}
function vsend(t){if(!S.voice)vstart();const v=S.voice,low=t.toLowerCase();v.m.push({r:'CUSTOMER',t});if(/humano|neto|gerente|manager|advogado|lawyer|emerg/i.test(low)){v.m.push({r:'SYSTEM',t:'Human handoff required. Automation stopped.'});v.summary='Escalado para revisão humana.';save();view();return}let r='Entendi. ';if(!v.f.s){v.f.s=t;r+='Qual é a localização?'}else if(!v.f.l){v.f.l=t;r+='Quando pretende começar?'}else if(!v.f.t){v.f.t=t;r+='Já tem faixa de orçamento?'}else if(!v.f.b){v.f.b=t;r+='Gostaria de contato de uma pessoa da JKDD?'}else{r+='Obrigado. Já tenho informação suficiente.';v.summary=`Serviço: ${v.f.s}; localização: ${v.f.l}; prazo: ${v.f.t}; orçamento: ${v.f.b}. Próxima ação: revisão humana.`}v.m.push({r:'AI',t:r});speak(r);save();view()}
function speak(t){try{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';speechSynthesis.speak(u)}}catch{}}
function mic(){const C=window.SpeechRecognition||window.webkitSpeechRecognition;if(!C)return alert('Microfone por reconhecimento não disponível. Digite a fala.');const r=new C();r.lang='pt-BR';r.onresult=e=>{$('#vin').value=e.results[0][0].transcript};r.onerror=()=>alert('Não foi possível usar o microfone.');r.start()}
render();})();
</script></body></html>
