<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="robots" content="noindex,nofollow"><title>JKDD Leads — Dev/Test</title><style>
:root{--bg:#07111f;--p:#0f1c2e;--p2:#14243a;--line:#263b55;--t:#eef6ff;--m:#91a7c0;--b:#1597ff;--g:#21c47b;--y:#f7b955}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#06101d,#0b1a2b 55%,#0b2440);color:var(--t);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:22px}.card{background:rgba(15,28,46,.96);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 20px 60px #0007}.auth{width:min(520px,100%)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px}.logo{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,#0b2139,#1597ff);display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:0 0 0 2px #54b8ff55 inset}.brand b{font-size:24px}.brand b span{color:#29a9ff}.muted{color:var(--m)}h1,h2,h3{margin:.2em 0}.field{display:grid;gap:6px;margin:10px 0}.field input,.field select,.field textarea{width:100%;background:#091524;border:1px solid #314763;color:var(--t);padding:12px;border-radius:12px;outline:none}.btn{border:1px solid #36516f;background:#172a42;color:var(--t);padding:10px 13px;border-radius:11px;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#0d86e8,#1ab6ff);color:#02101c;border:0;font-weight:800}.btn.danger{border-color:#8c3131;color:#ffc0c0}.notice{padding:10px 12px;border-radius:12px;background:#10263b;border:1px solid #2a4a68;margin:12px 0;color:#cfeaff}.warn{background:#30230c;border-color:#7f5d17;color:#ffe6a3}.shell{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:16px;background:#07111ef2;position:sticky;top:0;height:100vh}.nav{display:grid;gap:7px;margin-top:20px}.nav button{background:transparent;color:var(--m);border:1px solid transparent;text-align:left;padding:11px;border-radius:11px}.nav button.active,.nav button:hover{background:#13243a;color:#fff;border-color:#29425f}.main{min-width:0}.top{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);background:#091524dd;position:sticky;top:0;z-index:5}.content{padding:20px;max-width:1400px;margin:auto}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(4,1fr)}.two{grid-template-columns:1.1fr .9fr}.metric strong{font-size:28px}.pill{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800}.HOT{background:#5b2513;color:#ffd08a}.WARM{background:#47350b;color:#ffe797}.NURTURE{background:#0c3440;color:#84ecff}.LOW{background:#263243;color:#d4deeb}.row{border:1px solid #243a55;background:#0b1726;border-radius:13px;padding:12px;display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0}.row.sel{border-color:#1597ff;background:#0c2034}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.score{font-size:26px;font-weight:900}.ai{white-space:pre-wrap;background:#071b2b;border:1px solid #224e6c;border-radius:14px;padding:14px;min-height:120px}.chat{display:grid;gap:8px;max-height:330px;overflow:auto}.bubble{padding:10px 12px;border-radius:13px;max-width:88%}.bubble.ai{background:#0c2940;border:1px solid #1a5f8f}.bubble.cust{background:#1d2c3e;margin-left:auto}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.bottom{display:none}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{display:none}.metrics,.two{grid-template-columns:1fr 1fr}.content{padding:14px 14px 82px}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#07111ff2;border-top:1px solid var(--line);z-index:20}.bottom button{background:none;border:0;color:#91a7c0;padding:10px 3px;font-size:11px}.bottom button.active{color:#4db9ff}}@media(max-width:580px){.metrics,.two,.formgrid{grid-template-columns:1fr}.top{padding:13px}.top small{display:none}.content{padding:12px 12px 78px}.card{padding:14px}.brand b{font-size:21px}}
</style></head><body><div id="app"></div><script src="./p0/agentic-core.js"></script><script src="./p0/browser-adapter.js"></script><script>
(()=>{'use strict';const V='0.8.0-full-page-lead',K='jkdd-leads.pages.preview.v1',S='jkdd-leads.session.preview.v1';const P0=window.JKDDLeadsP0Browser.createBrowserAdapter();const seeds=[{id:'LD-1001',name:'Kener Santana',phone:'',service:'Finish Carpentry',status:'QUALIFIED',score:92,band:'HOT',source:'MANUAL_TEST',days:0},{id:'LD-1002',name:'Neto Santana',phone:'',service:'Doors & Trim',status:'NEW',score:68,band:'WARM',source:'MANUAL_TEST',days:3},{id:'LD-1003',name:'Davi Santana',phone:'',service:'Remodeling',status:'ROUTED',score:81,band:'HOT',source:'MANUAL_TEST',days:1}];let st={session:load(S,null),leads:load(K,seeds),route:'dashboard',selected:'LD-1001',ai:'Selecione um Lead ou pergunte à IA.',voice:[]};function load(k,f){try{let x=localStorage.getItem(k);return x?JSON.parse(x):structuredClone(f)}catch{return structuredClone(f)}}function save(){localStorage.setItem(K,JSON.stringify(st.leads));st.session?localStorage.setItem(S,JSON.stringify(st.session)):localStorage.removeItem(S);P0.save()}function e(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function digits(v=''){return String(v).replace(/\D/g,'')}function fp(v=''){let d=digits(v).slice(-10);return d.length===10?`(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`:v}function lead(){return st.leads.find(x=>x.id===st.selected)||st.leads[0]}function next(l){if(!l)return'Selecione um Lead.';if(l.band==='HOT'&&l.status==='NEW')return'Qualificar agora.';if(l.band==='HOT'&&l.status==='QUALIFIED')return'Fazer contato manual e preparar roteamento.';if(l.status==='ROUTED')return'Confirmar aceite antes do handoff.';if(l.days>=3)return'Fazer follow-up hoje.';return'Coletar mais contexto.'}function calc(x){let s=0;if(x.service)s+=30;if(x.location)s+=15;if(x.urgency==='now')s+=20;else if(x.urgency==='30d')s+=12;else s+=5;if(x.budget==='clear')s+=15;if(x.phone)s+=10;if(x.email)s+=5;return Math.min(100,s)}function band(s){return s>=80?'HOT':s>=60?'WARM':s>=35?'NURTURE':'LOW'}function brief(){let h=st.leads.filter(x=>x.band==='HOT').length,f=st.leads.filter(x=>x.days>=3).length,r=st.leads.filter(x=>x.score>=70&&['QUALIFIED','ROUTED'].includes(x.status)).length;return `Morning Brief — ${st.leads.length} Leads. ${h} HOT, ${f} follow-up pendente, ${r} pronto(s) para rota/handoff.`}function ask(q){q=(q||'').toLowerCase();if(q.includes('quente')||q.includes('hot'))return'Leads HOT: '+st.leads.filter(x=>x.band==='HOT').map(x=>`${x.name} (${x.score})`).join(', ');if(q.includes('lig')||q.includes('contat'))return[...st.leads].sort((a,b)=>b.score-a.score).map((x,i)=>`${i+1}. ${x.name} — ${next(x)}`).join('\n');if(q.includes('crm')||q.includes('handoff'))return'Prontos: '+st.leads.filter(x=>x.score>=70&&['QUALIFIED','ROUTED'].includes(x.status)).map(x=>x.name).join(', ');let l=lead();return l?`${l.name}: score ${l.score}/100 (${l.band}). Próxima ação: ${next(l)}`:brief()}function render(){if(!st.session)return login();document.getElementById('app').innerHTML=`<div class="shell"><aside class="side"><div class="brand"><div class="logo">JKDD</div><div><b>JKDD <span>Leads</span></b><div class="muted">Development/Test</div></div></div><div class="nav">${[['dashboard','🏠 Dashboard'],['leads','🎯 Leads'],['ai','🤖 AI Copilot'],['voice','🎙️ Voice Lab'],['settings','⚙️ Settings']].map(([r,t])=>`<button data-r="${r}" class="${st.route===r?'active':''}">${t}</button>`).join('')}</div><div class="muted" style="position:absolute;bottom:20px">Budget US$ 0<br>Production 🔒 untouched</div></aside><main class="main"><div class="top"><b>${title()}</b><small class="muted">${e(st.session.email)} • ${V}</small></div><div class="content" id="view"></div></main><nav class="bottom">${[['dashboard','🏠 Home'],['leads','🎯 Leads'],['ai','🤖 AI'],['voice','🎙️ Voice'],['settings','⚙️ More']].map(([r,t])=>`<button data-r="${r}" class="${st.route===r?'active':''}">${t}</button>`).join('')}</nav></div>`;document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{st.route=b.dataset.r;render()});view()}function title(){return({dashboard:'Dashboard',leads:'Lead Inbox',ai:'JKDD Leads AI',voice:'AI Voice Lab',settings:'Settings'})[st.route]}function login(){document.getElementById('app').innerHTML=`<div class="login"><div class="card auth"><div class="brand"><div class="logo">JKDD</div><div><b>JKDD <span>Leads</span></b><div class="muted">Capture • Qualify • Route • Grow</div></div></div><h2>Primeiro acesso</h2><p class="muted">Digite seu e-mail, faça seu cadastro e defina a primeira senha.</p><div class="field"><label>E-mail</label><input id="em" type="email" placeholder="seuemail@empresa.com"></div><div class="field"><label>Nome</label><input id="nm" value="Joaquim Neto"></div><div class="field"><label>Empresa</label><input id="co" value="JKDD Finish & Remodeling"></div><div class="formgrid"><div class="field"><label>Primeira senha</label><input id="pw" type="password" placeholder="8+ caracteres"></div><div class="field"><label>Confirmar senha</label><input id="pw2" type="password"></div></div><button class="btn primary" id="go" style="width:100%;margin-top:8px">Criar acesso e entrar</button><div class="notice warn"><b>Dev/Test:</b> a senha é validada na tela e descartada. Auth real será da 🧱 JKDD TECH Foundation.</div></div></div>`;document.getElementById('go').onclick=()=>{let em=document.getElementById('em').value.trim(),p=document.getElementById('pw').value,p2=document.getElementById('pw2').value;if(!/^\S+@\S+\.\S+$/.test(em))return alert('Digite um e-mail válido.');if(p.length<8||!/[A-Za-z]/.test(p)||!/\d/.test(p))return alert('Senha: 8+ caracteres, letra e número.');if(p!==p2)return alert('As senhas não conferem.');st.session={email:em,name:document.getElementById('nm').value.trim()||'Owner',company:document.getElementById('co').value.trim()||'JKDD',auth:'PENDING_FOUNDATION_WEB_ADAPTER'};save();render()}}
function view(){let v=document.getElementById('view');if(st.route==='dashboard')v.innerHTML=dash();if(st.route==='leads')v.innerHTML=leads();if(st.route==='ai')v.innerHTML=ai();if(st.route==='voice')v.innerHTML=voice();if(st.route==='settings')v.innerHTML=settings();bind()}function dash(){let hot=st.leads.filter(x=>x.band==='HOT').length,qual=st.leads.filter(x=>x.status!=='NEW').length,p=P0.metrics();return `<div class="grid metrics">${[['Total Leads',st.leads.length],['HOT',hot],['Qualified+',qual],['Agentic Queue',p.pendingTasks+p.leasedTasks]].map(x=>`<div class="card metric"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join('')}</div><div class="grid two" style="margin-top:14px"><div class="card"><h3>Recent Leads</h3>${rows()}</div><div class="card"><h3>🤖 Morning Brief</h3><div class="ai">${e(brief())}</div><div class="toolbar"><button class="btn primary" data-act="ai">Ask AI</button><button class="btn" data-act="new">+ New Lead</button></div></div></div>`}function rows(){return st.leads.map(l=>`<div class="row ${st.selected===l.id?'sel':''}" data-lead="${l.id}"><div><b>${e(l.name)}</b><div class="muted">${e(l.service)} • ${e(l.phone||'phone not set')}</div></div><div><span class="score">${l.score}</span> <span class="pill ${l.band}">${l.band}</span></div></div>`).join('')}function leads(){let l=lead();return `<div class="grid two"><div class="card"><div class="toolbar"><button class="btn primary" data-act="new">+ New Lead</button><button class="btn" data-act="reset">Reset demo</button></div>${rows()}</div><div class="card">${l?`<h2>${e(l.name)}</h2><div class="score">${l.score}/100 <span class="pill ${l.band}">${l.band}</span></div><p class="muted">${e(l.service)} • ${e(l.status)} • ${e(l.phone||'phone not set')}</p><div class="notice">Próxima ação: ${e(next(l))}</div><div class="toolbar"><button class="btn" data-act="advance">Advance lifecycle</button><button class="btn" data-act="call">☎️ Call manual</button><button class="btn" data-act="voice">🎙️ Voice Lab</button></div>`:'Selecione um Lead.'}</div></div>`}function ai(){let l=lead();return `<div class="grid two"><div class="card"><h3>🤖 AI Copilot</h3><div class="toolbar">${['Quem devo ligar agora?','Quais leads estão quentes?','Quem está pronto para CRM?'].map(q=>`<button class="btn" data-q="${q}">${q}</button>`).join('')}</div><div class="field"><textarea id="q" rows="3" placeholder="Pergunte à IA..."></textarea></div><button class="btn primary" data-act="ask">Analisar</button><div class="ai" style="margin-top:12px">${e(st.ai)}</div></div><div class="card"><h3>Selected Lead</h3>${l?`<h2>${e(l.name)}</h2><p>Score ${l.score} • ${l.band}</p><div class="notice">${e(next(l))}</div>`:'Nenhum'}</div></div>`}function voice(){let l=lead();return `<div class="grid two"><div class="card"><h3>🎙️ Voice Lab — zero cost</h3><p class="muted">Simulação no navegador. Nenhuma ligação real.</p><select id="vl">${st.leads.map(x=>`<option value="${x.id}" ${x.id===st.selected?'selected':''}>${e(x.name)}</option>`).join('')}</select><div class="toolbar"><button class="btn primary" data-act="speak">AI greeting</button><button class="btn" data-act="mic">🎤 Microphone</button></div><div class="field"><textarea id="vt" rows="3" placeholder="Digite a fala do cliente"></textarea></div><button class="btn" data-act="sendvoice">Send customer reply</button></div><div class="card"><h3>Conversation</h3><div class="chat" id="chat">${st.voice.length?st.voice.map(m=>`<div class="bubble ${m.r}">${e(m.t)}</div>`).join(''):'<div class="muted">Start the rehearsal.</div>'}</div></div></div>`}function settings(){let a=st.leads.find(x=>x.id==='LD-1001'),b=st.leads.find(x=>x.id==='LD-1002'),c=st.leads.find(x=>x.id==='LD-1003'),p=P0.metrics();return `<div class="grid two"><div class="card"><h3>Private Test Contacts — local only</h3><p class="muted">Telefones ficam somente neste navegador e não entram no código publicado.</p><div class="field"><label>Kener Santana</label><input id="p1" inputmode="tel" value="${e(a?.phone||'')}"></div><div class="field"><label>Neto Santana</label><input id="p2" inputmode="tel" value="${e(b?.phone||'')}"></div><div class="field"><label>Davi Santana</label><input id="p3" inputmode="tel" value="${e(c?.phone||'')}"></div><button class="btn primary" data-act="phones">Save locally</button></div><div class="card"><h3>🤖 Agentic P0 Core</h3><p>Canonical Leads: <b>${p.canonicalLeads}</b></p><p>Evidence items: <b>${p.evidenceItems}</b></p><p>Pending/leased work: <b>${p.pendingTasks+p.leasedTasks}</b></p><p>Completed tasks: <b>${p.completedTasks}</b></p><p>Audit events: <b>${p.auditEvents}</b></p><button class="btn primary" data-act="p0demo">Open Agentic P0 Lab</button></div><div class="card"><h3>Governance</h3><p>Budget: <b>US$ 0</b></p><p>Environment: Development/Test</p><p>Agentic Core: ACTIVE (browser-local P0)</p><p>Paid AI: OFF</p><p>Real telephony: OFF</p><p>Production: 🔒 UNTOUCHED</p><button class="btn danger" data-act="logout">Sign out</button></div></div>`}
function bind(){document.querySelectorAll('[data-lead]').forEach(x=>x.onclick=()=>{st.selected=x.dataset.lead;view()});document.querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>{st.ai=ask(x.dataset.q);view()});const A=(n,f)=>{let x=document.querySelector(`[data-act="${n}"]`);if(x)x.onclick=f};A('ai',()=>{st.route='ai';st.ai=brief();render()});A('new',()=>{location.href='./new-lead.html'});A('reset',()=>{if(confirm('Reset demo data and Agentic P0 state?')){st.leads=structuredClone(seeds);st.selected='LD-1001';P0.reset();save();view()}});A('advance',()=>{let l=lead();l.status=l.status==='NEW'?'QUALIFIED':l.status==='QUALIFIED'?'ROUTED':l.status==='ROUTED'?'HANDED_OFF':'HANDED_OFF';if(l.p0Id)P0.recordConciergeAction({leadId:l.p0Id,channel:'manual',action:'lifecycle_advanced',outcome:l.status,reviewedByHuman:true,now:new Date().toISOString()});save();view()});A('call',()=>{let l=lead();if(!l?.phone)return alert('Adicione o telefone em Settings primeiro.');if(l.p0Id)P0.recordConciergeAction({leadId:l.p0Id,channel:'phone',action:'manual_call_requested',outcome:'handed_to_device_dialer',reviewedByHuman:true,now:new Date().toISOString()});location.href='tel:'+digits(l.phone)});A('voice',()=>{st.route='voice';render()});A('ask',()=>{st.ai=ask(document.getElementById('q').value);view()});A('speak',()=>{let l=lead();let t=`Olá ${l.name}. Eu sou a assistente virtual da JKDD. Este é um teste sem ligação real. Como posso ajudar?`;st.voice.push({r:'ai',t});if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';speechSynthesis.speak(u)}view()});A('mic',()=>{let C=window.SpeechRecognition||window.webkitSpeechRecognition;if(!C)return alert('Microfone não suportado. Digite a fala.');let r=new C();r.lang='pt-BR';r.onresult=x=>document.getElementById('vt').value=x.results[0][0].transcript;r.start()});A('sendvoice',()=>{let t=document.getElementById('vt').value.trim();if(!t)return;st.voice.push({r:'cust',t});let ans=/preço|orçamento|budget/i.test(t)?'Entendi. Qual faixa de orçamento você considera?':'Entendi. Qual é o prazo ideal para você começar?';st.voice.push({r:'ai',t:ans});view()});A('phones',()=>{[['LD-1001','p1'],['LD-1002','p2'],['LD-1003','p3']].forEach(([id,p])=>{let l=st.leads.find(x=>x.id===id);if(l)l.phone=fp(document.getElementById(p).value)});save();alert('Telefones salvos somente neste navegador.');view()});A('p0demo',()=>{location.href='./p0/demo.html'});A('logout',()=>{st.session=null;save();render()})}function newLead(){let name=prompt('Lead name');if(!name)return;let phone=prompt('Phone (optional)')||'',email=prompt('Email (optional)')||'',service=prompt('Service / interest')||'Other',location=prompt('Location')||'',urgency=prompt('Urgency: now / 30d / later','30d')||'later',budget=confirm('Budget is clear?')?'clear':'unknown',x={name,phone:fp(phone),email,service,location,urgency,budget,source:'MANUAL'};try{let r=P0.ingestAndQualify(x,{source:'jkdd-leads-ui',followUpReason:'New qualified lead requires human-reviewed first contact.'}),existing=st.leads.find(y=>y.p0Id===r.canonicalLead.id);if(r.duplicate&&existing){st.selected=existing.id;save();alert('Duplicate detected. Existing canonical lead selected.');return view()}let l=existing||{id:'LD-'+(1001+st.leads.length),...x,p0Id:r.canonicalLead.id,status:r.qualification.score>=60?'QUALIFIED':'NEW',score:r.qualification.score,band:r.qualification.band,source:'MANUAL',days:0};if(!existing)st.leads.unshift(l);st.selected=l.id;save();if(r.duplicate)alert('Duplicate detected in Agentic P0. Reused the canonical lead.');view()}catch(err){alert('Agentic P0: '+err.message)}}render()})();
</script></body></html>
