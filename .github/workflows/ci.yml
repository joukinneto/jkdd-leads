name: JKDD Leads Dev/Test CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate app
        run: |
          set -e
          test -f index.html
          grep -q "JKDD Leads" index.html
          grep -q "Primeiro acesso" index.html
          grep -q "AI Copilot" index.html
          grep -q "Voice Lab" index.html
          ! grep -Eq "945.?275.?4375|561.?990.?6825|561.?990.?6807" index.html
          echo "STATIC_VALIDATION=PASS"

      - name: Validate P0 Agentic Lead Core
        run: |
          set -e
          node p0/self-test.cjs
          node p0/browser-adapter-self-test.cjs
          grep -q 'p0/agentic-core.js' index.html
          grep -q 'p0/browser-adapter.js' index.html
          grep -q '0.7.0-agentic-p0' index.html
